name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  list-qt-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List available Qt 6.11.x versions
        run: |
          python -m pip install aqtinstall
          python -m aqt list-qt linux desktop --modules-ignore qtquick3d | tr ' ' '\n' | grep '^6\.11' || true
          echo "---"
          python -m aqt list-qt linux desktop

  build:
    needs: list-qt-versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt_arch: linux_gcc_64
            artifact_name: MultimediaRetrieval-linux
          - os: windows-latest
            qt_arch: win64_msvc2022_64
            artifact_name: MultimediaRetrieval-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python (used by install-qt-action's aqtinstall)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          target: "desktop"
          arch: ${{ matrix.qt_arch }}
          modules: "qtquick3d"
          setup-python: "false" # we already set up a known-good Python above
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install OpenGL dev libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libglu1-mesa-dev

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: bash
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build --config Release --parallel